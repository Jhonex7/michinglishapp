name: CI

# Runs on every pull request (from forks too) and on pushes to the main
# branches. All jobs must pass before a PR can be merged (configure them as
# "required status checks" in the branch protection rules).
on:
  pull_request:
    branches: [main, develop, 'feature/**']
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contribution:
    name: Contribution check
    # Student content is validated when it enters develop. Promoting develop
    # to main only carries content that was already checked, so skip it there
    # (a skipped job still counts as passing for required status checks).
    if: >-
      github.event_name == 'pull_request' &&
      !(github.base_ref == 'main' &&
        github.head_ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Strict rules for the info.json files this PR adds or changes, plus a
      # summary table (student, code, social network) in the run summary.
      - name: Validate changed student content
        # The branch name comes from the PR author: pass it as env, never inline.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-contribution.mjs --base "origin/${{ github.base_ref }}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        run: npx vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total;console.log(`### 🧪 Coverage\n\n| Lines | Statements | Functions | Branches |\n|---|---|---|---|\n| ${t.lines.pct}% | ${t.statements.pct}% | ${t.functions.pct}% | ${t.branches.pct}% |`)' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
